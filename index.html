<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conciliação Contábil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Inicializar Supabase
        const SUPABASE_URL = 'https://vvxhgzrakjqlpydismvg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RfrD9BRYYChajZOJbdojQg_wYCaAsLy
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== COMPONENTE LOGIN ==========
        function LoginPage({ onLoginSuccess }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (error) {
                        setError(error.message);
                    } else {
                        onLoginSuccess(data.user);
                    }
                } catch (err) {
                    setError('Erro ao conectar ao servidor');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-blue-800">
                    <div className="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-800">Conciliação Contábil</h1>
                            <p className="text-gray-500 mt-2">Acesse sua conta</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">E-mail</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    placeholder="seu@email.com"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    placeholder="••••••••"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    required
                                />
                            </div>

                            {error && <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">{error}</div>}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 disabled:bg-gray-400"
                            >
                                {loading ? 'Entrando...' : 'Entrar'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // ========== COMPONENTE DASHBOARD COORDENADOR ==========
        function DashboardCoordenador({ user, onLogout }) {
            const [empresas, setEmpresas] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedEmpresa, setSelectedEmpresa] = useState(null);
            const [competencias, setCompetencias] = useState([]);

            useEffect(() => {
                carregarEmpresas();
            }, []);

            const carregarEmpresas = async () => {
                try {
                    const { data, error } = await supabase
                        .from('empresas')
                        .select('*')
                        .eq('escritorio_id', 1);

                    if (error) throw error;
                    setEmpresas(data || []);
                } catch (err) {
                    console.error('Erro ao carregar empresas:', err);
                } finally {
                    setLoading(false);
                }
            };

            const abrirDetalhes = async (empresa) => {
                setSelectedEmpresa(empresa);
                try {
                    const { data, error } = await supabase
                        .from('competencias')
                        .select('*')
                        .eq('empresa_id', empresa.id)
                        .order('ano', { ascending: false })
                        .order('mes', { ascending: false })
                        .limit(3);

                    if (error) throw error;
                    setCompetencias(data || []);
                } catch (err) {
                    console.error('Erro ao carregar competências:', err);
                }
            };

            return (
                <div className="flex h-screen bg-gray-50">
                    {/* Menu Lateral */}
                    <div className="w-64 bg-blue-900 text-white p-6">
                        <h2 className="text-2xl font-bold mb-8">Conciliação</h2>
                        <nav className="space-y-4">
                            <div className="text-sm font-semibold text-blue-200">MENU</div>
                            <button className="w-full text-left px-4 py-2 bg-blue-800 rounded">Dashboard</button>
                            <button className="w-full text-left px-4 py-2 hover:bg-blue-800 rounded">Empresas</button>
                            <button className="w-full text-left px-4 py-2 hover:bg-blue-800 rounded">Analistas</button>
                        </nav>

                        <div className="absolute bottom-6 left-6 right-6">
                            <button
                                onClick={onLogout}
                                className="w-full bg-red-600 hover:bg-red-700 px-4 py-2 rounded font-semibold"
                            >
                                Sair
                            </button>
                        </div>
                    </div>

                    {/* Conteúdo Principal */}
                    <div className="flex-1 overflow-auto">
                        <div className="p-8">
                            <div className="flex justify-between items-center mb-8">
                                <h1 className="text-3xl font-bold text-gray-800">Dashboard - Coordenador</h1>
                                <span className="text-gray-600">{user.email}</span>
                            </div>

                            {/* Números de resumo */}
                            <div className="grid grid-cols-4 gap-4 mb-8">
                                <div className="bg-white p-6 rounded-lg shadow">
                                    <div className="text-2xl font-bold text-blue-600">{empresas.length}</div>
                                    <div className="text-gray-600">Empresas</div>
                                </div>
                                <div className="bg-white p-6 rounded-lg shadow">
                                    <div className="text-2xl font-bold text-green-600">0</div>
                                    <div className="text-gray-600">Concluídas</div>
                                </div>
                                <div className="bg-white p-6 rounded-lg shadow">
                                    <div className="text-2xl font-bold text-yellow-600">0</div>
                                    <div className="text-gray-600">Em Andamento</div>
                                </div>
                                <div className="bg-white p-6 rounded-lg shadow">
                                    <div className="text-2xl font-bold text-red-600">0</div>
                                    <div className="text-gray-600">Problemas</div>
                                </div>
                            </div>

                            {/* Tabela de Empresas */}
                            <div className="bg-white rounded-lg shadow overflow-hidden">
                                <table className="w-full">
                                    <thead className="bg-gray-100 border-b">
                                        <tr>
                                            <th className="px-6 py-3 text-left text-sm font-semibold text-gray-700">Empresa</th>
                                            <th className="px-6 py-3 text-left text-sm font-semibold text-gray-700">CNPJ</th>
                                            <th className="px-6 py-3 text-left text-sm font-semibold text-gray-700">Analista</th>
                                            <th className="px-6 py-3 text-left text-sm font-semibold text-gray-700">Telefone</th>
                                            <th className="px-6 py-3 text-center text-sm font-semibold text-gray-700">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {loading ? (
                                            <tr><td colSpan="5" className="px-6 py-4 text-center text-gray-500">Carregando...</td></tr>
                                        ) : empresas.length === 0 ? (
                                            <tr><td colSpan="5" className="px-6 py-4 text-center text-gray-500">Nenhuma empresa cadastrada</td></tr>
                                        ) : (
                                            empresas.map((empresa) => (
                                                <tr key={empresa.id} className="border-b hover:bg-gray-50">
                                                    <td className="px-6 py-4 font-medium text-gray-800">{empresa.nome}</td>
                                                    <td className="px-6 py-4 text-gray-600">{empresa.cnpj}</td>
                                                    <td className="px-6 py-4 text-gray-600">{empresa.analista_responsavel_id || '-'}</td>
                                                    <td className="px-6 py-4 text-gray-600">{empresa.telefone || '-'}</td>
                                                    <td className="px-6 py-4 text-center">
                                                        <button
                                                            onClick={() => abrirDetalhes(empresa)}
                                                            className="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700"
                                                        >
                                                            Detalhes
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* Modal de Detalhes */}
                    {selectedEmpresa && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                            <div className="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
                                <h2 className="text-2xl font-bold mb-4">{selectedEmpresa.nome}</h2>
                                <div className="space-y-2 mb-6">
                                    <p><strong>CNPJ:</strong> {selectedEmpresa.cnpj}</p>
                                    <p><strong>Telefone:</strong> {selectedEmpresa.telefone}</p>
                                    <p><strong>E-mail:</strong> {selectedEmpresa.email}</p>
                                    <p><strong>Contato:</strong> {selectedEmpresa.contato_principal}</p>
                                </div>

                                <div className="mb-6">
                                    <h3 className="font-semibold mb-3">Últimas Competências:</h3>
                                    <div className="space-y-2 max-h-40 overflow-y-auto">
                                        {competencias.map((comp) => (
                                            <div key={comp.id} className="bg-gray-100 p-2 rounded text-sm">
                                                <p><strong>{comp.ano}/{comp.mes}</strong> - {comp.status}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <button
                                    onClick={() => setSelectedEmpresa(null)}
                                    className="w-full bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded font-semibold"
                                >
                                    Fechar
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ========== COMPONENTE DASHBOARD ANALISTA ==========
        function DashboardAnalista({ user, onLogout }) {
            const [empresas, setEmpresas] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                carregarEmpresas();
            }, [user]);

            const carregarEmpresas = async () => {
                try {
                    const { data: userData, error: userError } = await supabase
                        .from('usuarios')
                        .select('id')
                        .eq('email', user.email)
                        .single();

                    if (userError) throw userError;

                    const { data, error } = await supabase
                        .from('empresas')
                        .select('*')
                        .eq('analista_responsavel_id', userData.id);

                    if (error) throw error;
                    setEmpresas(data || []);
                } catch (err) {
                    console.error('Erro ao carregar empresas:', err);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex h-screen bg-gray-50">
                    {/* Menu Lateral */}
                    <div className="w-64 bg-green-900 text-white p-6">
                        <h2 className="text-2xl font-bold mb-8">Conciliação</h2>
                        <nav className="space-y-4">
                            <div className="text-sm font-semibold text-green-200">MENU</div>
                            <button className="w-full text-left px-4 py-2 bg-green-800 rounded">Dashboard</button>
                            <button className="w-full text-left px-4 py-2 hover:bg-green-800 rounded">Extratos</button>
                            <button className="w-full text-left px-4 py-2 hover:bg-green-800 rounded">Checklist</button>
                            <button className="w-full text-left px-4 py-2 hover:bg-green-800 rounded">Tarefas</button>
                        </nav>

                        <div className="absolute bottom-6 left-6 right-6">
                            <button
                                onClick={onLogout}
                                className="w-full bg-red-600 hover:bg-red-700 px-4 py-2 rounded font-semibold"
                            >
                                Sair
                            </button>
                        </div>
                    </div>

                    {/* Conteúdo Principal */}
                    <div className="flex-1 overflow-auto">
                        <div className="p-8">
                            <div className="flex justify-between items-center mb-8">
                                <h1 className="text-3xl font-bold text-gray-800">Dashboard - Analista</h1>
                                <span className="text-gray-600">{user.email}</span>
                            </div>

                            <h2 className="text-xl font-semibold mb-4">Minhas Empresas</h2>

                            {loading ? (
                                <div className="text-center text-gray-500">Carregando...</div>
                            ) : empresas.length === 0 ? (
                                <div className="text-center text-gray-500 py-8">Nenhuma empresa atribuída ainda</div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {empresas.map((empresa) => (
                                        <div key={empresa.id} className="bg-white rounded-lg shadow-lg p-6">
                                            <h3 className="text-lg font-semibold text-gray-800 mb-2">{empresa.nome}</h3>
                                            <p className="text-sm text-gray-600 mb-4">{empresa.cnpj}</p>
                                            <button className="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-semibold">
                                                Abrir Detalhes
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ========== COMPONENTE PRINCIPAL ==========
        function App() {
            const [user, setUser] = useState(null);
            const [userRole, setUserRole] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                checkAuth();
            }, []);

            const checkAuth = async () => {
                try {
                    const { data } = await supabase.auth.getSession();
                    if (data?.session?.user) {
                        setUser(data.session.user);
                        
                        const { data: userData, error } = await supabase
                            .from('usuarios')
                            .select('papel')
                            .eq('email', data.session.user.email)
                            .single();

                        if (!error && userData) {
                            setUserRole(userData.papel);
                        }
                    }
                } catch (err) {
                    console.error('Erro ao verificar autenticação:', err);
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = async () => {
                await supabase.auth.signOut();
                setUser(null);
                setUserRole(null);
            };

            if (loading) {
                return <div className="flex items-center justify-center h-screen text-gray-500">Carregando...</div>;
            }

            if (!user) {
                return <LoginPage onLoginSuccess={(u) => { setUser(u); checkAuth(); }} />;
            }

            if (userRole === 'coordenador') {
                return <DashboardCoordenador user={user} onLogout={handleLogout} />;
            }

            if (userRole === 'analista') {
                return <DashboardAnalista user={user} onLogout={handleLogout} />;
            }

            return <div className="flex items-center justify-center h-screen text-red-500">Erro: papel de usuário não definido</div>;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
